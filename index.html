        * {

        body {

            /* الخلفية المتدرجة الهادية والمريحة للعين */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

        /* حاوية التصميم الزجاجي (نفس التصميم اللول) */
        .glass-container {

            padding: 50px 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .glass-container h1 {
            font-size: 2.2rem;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* شبكة البطاقات */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* بطاقة التطبيق الزجاجية */
        .app-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 20px;
            transition: transform 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-wrapper {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .app-version {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            margin-bottom: 35px;
        }

        /* أزرار التحميل */
        .download-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff4b2b 0%, #ff416c 100%);
            color: #fff;
            text-decoration: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.2);
            width: 80%;
        }

        .download-btn:hover {
            box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4);
            transform: scale(1.05);
        }

        .download-btn.secondary {
            background: linear-gradient(90deg, #e0eafc 0%, #cfdef3 100%);
            color: #333;
            box-shadow: 0 10px 20px rgba(207, 222, 243, 0.2);
